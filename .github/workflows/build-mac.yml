name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout original repo
        uses: actions/checkout@v4
        with:
          repository: halilozat/jarvis
          path: original

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm ci --prefix original/server

      - name: Install web dependencies
        run: npm ci --prefix original/web

      - name: Build project
        run: npm run build --prefix original

      - name: Install Electron and electron-builder
        run: npm install --no-save electron@36 electron-builder --prefix original

      - name: Create Electron main process
        run: |
          mkdir -p original/desktop
          cat > original/desktop/main.cjs

      - name: Patch package.json and build with electron-builder
        run: |
          cd original
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.main = 'desktop/main.cjs';
            pkg.build = {
              appId: 'ai.jarvis.personal',
              productName: 'Jarvis Personal',
              directories: { output: 'dist-mac' },
              files: ['desktop/**','web/dist/**','server/dist/**','server/src/**','server/package.json','web/package.json'],
              mac: { target: [{target:'dmg', arch:['universal']}], category: 'public.app-category.productivity' }
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac universal --publish never

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Personal.dmg
          path: original/dist-mac/*.dmg
